# The deployable manifest for this DaemonSet, attached to every GitHub Release as an asset.
#
# The image carries the last released tag, never `:latest`. This DaemonSet writes the CNI conflist
# that decides how every pod on the node gets networking, so a floating tag here means a node
# reboot can pull a different one than its neighbours are running - the reason IaC/k8s/main's own
# `cni-config` component patches this to a digest on top.
#
# Release CI rewrites whatever tag is here to the release's own before attaching the asset (see
# .github/workflows/release.yml), so forgetting to bump this line cannot produce an asset pointing
# at the wrong image - the bump keeps the in-repo copy honest, CI keeps the released one correct.
#
# This cluster no longer installs it through Talos: `cluster.network.cni` is `none` and the
# DaemonSet is owned by Argo (IaC/k8s/main's `cni-config` component), which pins it further by
# digest. The Talos `cni: {name: custom, urls: [...]}` route still works and is what the release
# asset exists for.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cni-config
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cni-config
rules:
  # Only its own Node is ever fetched (the watch is server-side field-selected on metadata.name),
  # but RBAC itself can't scope get/watch/list to "just the caller's own object" - the field
  # selector is what actually narrows it down.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cni-config
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cni-config
subjects:
  - kind: ServiceAccount
    name: cni-config
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cni-config
  namespace: kube-system
  labels:
    app: cni-config
spec:
  selector:
    matchLabels:
      app: cni-config
  template:
    metadata:
      labels:
        app: cni-config
    spec:
      serviceAccountName: cni-config
      # Runs before/independent of any CNI being up yet - hostNetwork so this pod itself doesn't
      # need pod networking to reach the API server.
      hostNetwork: true
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      containers:
        - name: cni-config
          image: ghcr.io/slipmesh/cni-config:v0.1.0
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: cni-net-d
              mountPath: /etc/cni/net.d
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: cni-net-d
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
