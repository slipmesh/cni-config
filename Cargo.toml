[package]
name = "cni-config"
version = "0.1.10"
edition = "2024"
authors = ["slipmesh"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/slipmesh/cni-config"
# Ships as an image, never to crates.io.
publish = false
description = "Watches this node's own Node.spec.podCIDRs and writes a bridge/host-local CNI conflist for it"

[[bin]]
name = "cni-config"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
atomic-write-file = "0.3.1"
futures = "0.3.34"
ipnet = "2.12.2"
k8s-openapi = { version = "0.29.0", features = ["v1_37"] }
kube = { version = "5.0.0", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "runtime"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "signal"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["net", "io-util", "time"] }
