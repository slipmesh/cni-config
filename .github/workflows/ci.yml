# Pull requests and pushes run the checks; only a merged release PR is built, in its own run, and
# released. The DaemonSet manifest attached to each release is what `cluster.network.cni.urls` in
# Talos machine config fetches, over plain HTTP rather than as an OCI pull.
name: CI

on:
  push:
    branches: [main, "release-*"]
  pull_request:
  # cargo audit depends on the advisory database, not on the commit.
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: slipmesh/.github/.github/workflows/rust.yml@v2.1

  release-commit:
    if: github.event_name == 'push'
    uses: slipmesh/.github/.github/workflows/release-commit.yml@v2.1

  build:
    needs: [release-commit, checks]
    if: needs.release-commit.outputs.version != ''
    uses: slipmesh/.github/.github/workflows/rust-build.yml@v2.1
    with:
      binaries: cni-config

  image:
    needs: build
    uses: slipmesh/.github/.github/workflows/image.yml@v2.1
    permissions:
      contents: read
      packages: write

  tag:
    needs: [release-commit, image]
    uses: slipmesh/.github/.github/workflows/tag-release.yml@v2.1
    permissions:
      contents: write
    with:
      version: ${{ needs.release-commit.outputs.version }}

  promote:
    needs: [release-commit, tag]
    uses: slipmesh/.github/.github/workflows/promote.yml@v2.1
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.release-commit.outputs.version }}
      latest: ${{ needs.release-commit.outputs.latest == 'true' }}

  release:
    needs: [release-commit, promote]
    uses: slipmesh/.github/.github/workflows/release.yml@v2.1
    permissions:
      contents: write
    with:
      tag: ${{ needs.release-commit.outputs.version }}
      latest: ${{ needs.release-commit.outputs.latest == 'true' }}
      prerelease: ${{ needs.release-commit.outputs.prerelease == 'true' }}
      # Substitutes whatever tag the in-repo manifest carries, not just a specific one, so the asset
      # can never advertise an image other than its own release, even if the in-repo bump was
      # forgotten. Promote has pushed this exact image tag by now, so the reference resolves.
      prepare: |
        sed -i "s|\(image: ghcr.io/slipmesh/cni-config\):[^[:space:]]*|\1:$RELEASE_TAG|" deploy/daemonset.yaml
        grep -n 'image:' deploy/daemonset.yaml
        grep -q "cni-config:$RELEASE_TAG" deploy/daemonset.yaml
      assets: deploy/daemonset.yaml
