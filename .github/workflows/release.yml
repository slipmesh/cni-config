# Triggered by the `vX.Y.Z` tag pushed after a release. Builds for amd64+arm64 and pushes a
# multi-arch manifest to GHCR under ghcr.io/<repo>/cni-config, tagged with the release version and
# `latest`, then creates a GitHub Release for the same tag carrying deploy/daemonset.yaml as an
# asset - that release-asset URL is what `cluster.network.cni.urls` in Talos machine config points
# at (a plain HTTP GET on raw YAML, not an OCI pull).
#
# Nothing is emulated or cross-compiled. Each arch builds on a runner of that architecture -
# ubuntu-24.04-arm for arm64, free for public repositories - with a plain `cargo build` for its
# musl target, so the binary is the one a local `cargo build --target <arch>-unknown-linux-musl`
# produces, and the `certs` stage's own `apk add` runs natively too. musl-tools supplies the
# `musl-gcc` that aws-lc-sys builds its C part with. Same build-by-digest-then-merge shape the
# other repositories use.
name: Release image

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Stage binary at its TARGETARCH path
        run: |
          mkdir -p target/${{ matrix.arch }}/release
          cp target/${{ matrix.rust_target }}/release/cni-config target/${{ matrix.arch }}/release/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.ref_name }}" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

  release:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Substitutes whatever tag the in-repo manifest carries, not just a specific one: the point
      # is that an asset can never advertise an image other than its own release, even if the
      # in-repo bump was forgotten. The merge job above pushed this exact version tag alongside
      # `latest`, so the substituted tag always resolves.
      - name: Pin the manifest's image to this release's tag
        run: |
          sed -i "s|\(image: ghcr.io/slipmesh/cni-config\):[^[:space:]]*|\1:${{ github.ref_name }}|" \
            deploy/daemonset.yaml
          grep -n 'image:' deploy/daemonset.yaml
          grep -q "cni-config:${{ github.ref_name }}" deploy/daemonset.yaml

      - name: Create GitHub Release with the DaemonSet manifest attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" deploy/daemonset.yaml \
            --title "${{ github.ref_name }}" \
            --generate-notes
