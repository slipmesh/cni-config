# Checks, image and release through the organization's shared workflows, so that what ships is
# what was tested: every push and pull request runs the Rust checks and builds the image, a push
# to main also publishes it as `sha-<commit>`, and a `vX.Y.Z` tag builds nothing - it retags that
# image as `vX.Y.Z` and `latest` and creates a GitHub Release carrying deploy/daemonset.yaml. That
# release-asset URL is what `cluster.network.cni.urls` in Talos machine config points at (a plain
# HTTP GET on raw YAML, not an OCI pull).
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    if: github.ref_type != 'tag'
    uses: slipmesh/.github/.github/workflows/rust.yml@ci/reusable-workflows
    with:
      binaries: cni-config

  image:
    needs: rust
    if: github.ref_type != 'tag'
    uses: slipmesh/.github/.github/workflows/image.yml@ci/reusable-workflows
    permissions:
      contents: read
      packages: write

  release:
    if: github.ref_type == 'tag'
    uses: slipmesh/.github/.github/workflows/release.yml@ci/reusable-workflows
    permissions:
      contents: write
      packages: write
    with:
      latest-image: true
      # Substitutes whatever tag the in-repo manifest carries, not just a specific one, so the asset
      # can never advertise an image other than its own release, even if the in-repo bump was
      # forgotten. The release workflow pushes this exact image tag before it runs `prepare`, so
      # the substituted reference always resolves.
      prepare: |
        sed -i "s|\(image: ghcr.io/slipmesh/cni-config\):[^[:space:]]*|\1:$GITHUB_REF_NAME|" deploy/daemonset.yaml
        grep -n 'image:' deploy/daemonset.yaml
        grep -q "cni-config:$GITHUB_REF_NAME" deploy/daemonset.yaml
      assets: deploy/daemonset.yaml
